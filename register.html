<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center">
    <div class="border-2 shadow-2xl bg-white mx-auto rounded-3xl p-8 max-w-md">
        <div class="m-auto w-12 border rounded-md bg-slate-300 shadow-xl p-2 flex justify-center">
            <img src="Images/add-user.png" alt="Add User" class="w-10">
        </div>

        <div class="text-center">
            <h2 class="text-2xl font-bold text-black  mt-4 mb-2">Create Account</h2>
            <p class="text-gray-300">Join us today!It only takes a minute.</p>
        </div>

        <form action="" method="post" class="space-y-4 mt-4">
            <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-2">
                <div class="w-full flex flex-col gap-2">
                    <label for="name" class="font-bold">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe"
                        class="w-full border-t rounded-md bg-white shadow-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required>
                </div>
                <div class="w-full flex flex-col gap-2">
                    <label for="email" class="font-bold">Email Address</label>
                    <input type="text" id="email" name="email" placeholder="name@company.com"
                        class="w-full border-t rounded-md bg-white shadow-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                        required>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="password" class="font-bold">Password</label>
                <input type="password" id="password" placeholder=" ........" minlength="8"
                    class="border-t rounded-md bg-white shadow-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    required>
            </div>
            <div class="flex flex-col gap-2">
                <label for="confirmpassword" class="font-bold">Confirm Password</label>
                <input type="conpassword" id="conpassword" placeholder=" ........" minlength="8"
                    class="border-t rounded-md bg-white shadow-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    required>
            </div>

            <div class="flex">
                <input type="checkbox" id="check"required>
                <label for="check">I agree to the<a href="" class="underline text-blue-700">Terms of Service</a> and <a href="#"
                        class="underline text-blue-700">Privacy Policy</a> </label>
            </div>
                <button type="submit"
                    class="text-white font-bold border-t rounded-md bg-blue-600 w-full p-4 shadow-md">Create My Account
                    >></button>
                <p class="text-center mt-2">Already have an account?
                <a href="login.html" class="text-blue-700">Sign in here</a></p>

        </form>
    </div>
</body>

</html>
