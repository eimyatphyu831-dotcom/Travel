<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class= "w-1/3 border-t shadow-xl bg-white m-auto mt-20 rounded-xl p-8">
        <div class="m-auto w-12 border rounded-md bg-white shadow-md p-2 flex justify-center items-center ">
            <img src="Images/profilesign.jpg" alt="Profile" class="w-10">
        </div>

        <div>
            <h2 class="text-3xl font-bold text-black text-center mt-4 mb-2">Create Account</h2>
            <p class="text-center">Join us today!It only takes a minute.</p>
        </div>

        <form class="flex flex-col gap-6 mt-4">
            <div class="w-full flex space-x-4">
                <div class="w-full flex flex-col gap-2">
                    <label for="fullname" class="font-bold">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe"
                        class="w-full border-t rounded-md bg-white shadow-md p-2">
                </div>
                <div class="w-full flex flex-col gap-2">
                    <label for="email" class="font-bold">Email Address</label>
                    <input type="text" id="email" name="email" placeholder="name@company.com"
                        class="w-full border-t rounded-md bg-white shadow-md p-2">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="password" class="font-bold">Password</label>
                <input type="password" id="password" placeholder=" ........" max-length="8"
                    class="border-t rounded-md bg-white shadow-md p-2">
            </div>
            <div class="flex flex-col gap-2">
                <label for="confirmpassword" class="font-bold">Confirm Password</label>
                <input type="conpassword" id="conpassword" placeholder=" ........" max-length="8"
                    class="border-t rounded-md bg-white shadow-md p-2">
            </div>

            <div class="flex">
                <input type="checkbox">
                <p>I agree to the </p>
                <a href="" class="underline text-violet-600">Terms of Service</a>
                <p>and</p>
                <a href="#" class="underline text-violet-600">Privacy Policy</a>
            </div>

            <div>
                <button type="submit" class="text-white font-bold border-t rounded-md bg-violet-950 w-full p-2 shadow-md">Create My Account
                    >></button>
            </div>

            <div class="flex mt-2 justify-center">
                <p class="text-center">Already have an account?</p>
                <a href="#" class="text-violet-600">Sign in here</a>
            </div>

        </form>
    </div>
</body>

</html>
