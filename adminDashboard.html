<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200">
    <div class="w-full min-h-screen flex relative overflow-x-hidden">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-700 flex flex-col justify-between transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0">
            <div class="w-full">
                <div class="flex items-center mb-6 gap-2 border-b bg-black justify-center">
                    <img src="Images/online-shop.png" alt="Mobie Shop" class="w-8 py-3">
                    <h1 class="text-slate-100 text-xl font-semibold">MobileShop</h1>
                    <button id="close-sidebar" class="text-gray-400 hover:text-white md:hidden text-xl p-2">
                        ✕
                    </button>
                </div>
                <nav class="mt-4">
                    <p class="text-sm text-gray-400 px-2 py-2">MANAGEMENT</p>
                    <ul class="space-y-1"> <li><a href="#"
                                class="bg-pink-800 flex items-center px-4 py-2 text-slate-200 rounded-md w-60 m-2">Dashboard</a>
                        </li>
                        <li><a href="#"
                                class="hover:bg-gray-500 flex items-center px-4 py-2 text-slate-200">Products</a></li>
                        <li><a href="#" class="hover:bg-gray-500 flex items-center px-4 py-2 text-slate-200">Orders</a>
                        </li>
                        <li><a href="#" class="hover:bg-gray-500 flex items-center px-4 py-2 text-slate-200">Users</a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="mb-6 p-6 border-t">
                <button type="submit"
                    class="text-slate-200 rounded-md bg-gray-600 hover:bg-blue-600 px-4 py-2.5 w-full text-center">Logout</button>
            </div>
        </aside>

        <div id="sidebarBackdrop" class="fixed inset-0 bg-black opacity-0 pointer-events-none transition-opacity duration-300 z-40 md:hidden"></div>

        <section class="flex-1 flex flex-col min-w-0">
            <nav class="text-black bg-white py-3.5 border shadow-lg px-4 flex items-center">
                <button id="menu-btn" class="md:hidden text-slate-700 hover:text-slate-900 text-2xl focus:outline-none">
                    ☰ 
                </button>
                <h1 class="text-lg font-bold">Dashboard</h1>
               
            </nav>

            <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 my-8 px-4">
                <div class="flex border-md rounded-md shadow-xl px-4 py-4 gap-2 bg-white">
                    <img src="Images/dollar (1).png" alt="Sale"
                        class="w-8 h-10 border-md rounded-md bg-green-100 shadow-lg p-2">
                    <div>
                        <p class="text-sm">Total Sales</p>
                        <h1 class="font-bold text-xl">$0.00</h1>
                    </div>
                </div>
                <div class="flex border-md rounded-md shadow-lg px-4 py-4 gap-2 bg-white">
                    <img src="Images/order.png" alt="Orders"
                        class="w-8 h-10 border-md rounded-md bg-blue-200 shadow-lg p-2">
                    <div>
                        <p class="text-sm">Total Orders</p>
                        <h1 class="font-bold text-xl">0</h1>
                    </div>
                </div>
                <div class="flex border-md rounded-md shadow-lg px-4 py-4 gap-2 bg-white">
                    <img src="Images/customer.png" alt="Customers"
                        class="w-8 h-10 border-md rounded-md bg-purple-200 shadow-lg p-1">
                    <div>
                        <p class="text-sm">Customers</p>
                        <h1 class="font-bold text-xl">1</h1>
                    </div>
                </div>
                <div class="flex border-md rounded-md shadow-lg px-4 py-4 gap-2 bg-white">
                    <img src="Images/lowstock.png" alt="Low Stock"
                        class="w-8 h-10 border-md rounded-md bg-red-200 shadow-lg p-2">
                    <div>
                        <p class="text-sm">Low Stock Items</p>
                        <h1 class="font-bold text-xl">0</h1>
                    </div>
                </div>
            </div>

            <div class="px-4">
                <div class="flex justify-between border bg-white rounded-t-xl shadow-lg py-2">
                    <h1 class="text-lg font-semibold px-4">Recent Orders</h1>
                    <a href="#" class="text-md text-purple-400 pr-4">View all>></a>
                </div>
                <div class="overflow-x-auto border-b w-full">
                    <table class=" bg-white w-full text-left border-b border-collapse rounded-b-xl">
                        <thead> <tr>
                                <th class="px-4 py-2 font-semibold">ORDER ID</th>
                                <th class="px-4 py-2 font-semibold">CUSTOMER</th>
                                <th class="px-4 py-2 font-semibold">DATE</th>
                                <th class="px-4 py-2 font-semibold">TOTAL</th>
                                <th class="px-4 py-2 font-semibold">STATUS</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menu-btn');
        const closeSidebar = document.getElementById('close-sidebar');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');

        function openMenu() {
            sidebar.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('opacity-0', 'pointer-events-none');
            sidebarBackdrop.classList.add('opacity-50', 'pointer-events-auto');
        }

        function closeMenu() {
            sidebar.classList.add('-translate-x-full');
            sidebarBackdrop.classList.remove('opacity-50', 'pointer-events-auto');
            sidebarBackdrop.classList.add('opacity-0', 'pointer-events-none');
        }

        menuBtn.addEventListener('click', openMenu);
        closeSidebar.addEventListener('click', closeMenu);
        sidebarBackdrop.addEventListener('click', closeMenu);
    </script>
</body>

</html>
