<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="w-1/3 border-2 shadow-2xl bg-white m-auto mt-12 rounded-3xl p-8">
        <div class="m-auto w-12 border rounded-md bg-slate-300 shadow-xl p-2 flex justify-center items-center ">
            <img src="Images/lock.png" alt="Lock" class="w-10">
        </div>

        <div>
            <h2 class="text-3xl font-bold text-black text-center mt-4 mb-2">Welcome Back</h2>
            <p class="text-center">Enter your credentials to access your account</p>
        </div>

        <form action="" method="post" class="gap-6 mt-4">

            <div class="flex flex-col gap-2">
                <label for="email" class="font-bold">Email Address</label>
                <input type="text" id="email" name="email" placeholder="name@company.com"
                    class="w-full border-t rounded-md bg-white shadow-md p-2" required>
            </div>
            <div class="flex flex-col gap-2 mt-2">
                <label for="password" class="font-bold">Password</label>
                <input type="password" id="password" placeholder=" ........" minlength="8"
                    class="border-t rounded-md bg-white shadow-md p-2" required>
            </div>

            <div class="flex justify-between mt-4">
                <div class="flex">
                    <input type="checkbox" id="check" required>
                    <p>Remember me </p>
                </div>
                <a href="" class="text-blue-700">Forgot Password?</a>
            </div>

            <div class="mt-4">
                <button type="submit"
                    class="text-white font-bold border-t rounded-md bg-blue-600 w-full p-2 shadow-md">Log in &#10132;
                </button>
            </div>

            <div class="flex mt-2 justify-center">
                <p class="text-center">Don't you have an account yet?</p>
                <a href="register.html" class="text-blue-700">Sign up for free</a>
            </div>

        </form>
    </div>
</body>

</html>
